name: Build petroppo Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3.0" "scipy>=1.11,<2.0" "scikit-learn>=1.3,<2.0" "matplotlib>=3.7,<4.0" "PySide6>=6.6" "pyinstaller>=6.3" "pillow"

      - name: Apply frozen-aware patch
        shell: cmd
        run: python build\windows\make_frozen_aware.py

      - name: Generate sample data (small for CI speed)
        shell: cmd
        run: python build\windows\generate_sample_data.py --size small

      - name: Build exe with PyInstaller
        shell: cmd
        run: python -m PyInstaller build\windows\petroppo.spec --clean --noconfirm

      - name: Verify exe created
        shell: cmd
        run: |
          dir dist\petroppo\petroppo.exe
          if not exist dist\petroppo\petroppo.exe (echo EXE NOT FOUND && exit /b 1)

      - name: Zip the distribution folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\petroppo\* -DestinationPath petroppo_portable.zip -Force
          Write-Host "Created petroppo_portable.zip"
          Get-Item petroppo_portable.zip | Select-Object Name, Length

      - name: Upload portable exe zip
        uses: actions/upload-artifact@v4
        with:
          name: petroppo-portable-exe
          path: petroppo_portable.zip
          retention-days: 90

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          iscc build\windows\petroppo_installer.iss
          dir dist\petroppo_setup.exe

      - name: Upload installer exe
        uses: actions/upload-artifact@v4
        with:
          name: petroppo-setup-installer
          path: dist\petroppo_setup.exe
          retention-days: 90
