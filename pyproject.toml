[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petroppo"
version = "39.0.0"
description = "petroppo V35 — Total Supremacy Edition: certified subsurface geophysics platform with web console UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "petroppo Team" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9.0"]
competitors = [
    "simpeg>=0.23",
    "discretize>=0.11",
]
dev = ["pytest>=7.4,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["petroppo*", "benchmark_suite*"]

[tool.pytest.ini_options]
testpaths = ["tests", "verification"]
addopts = "-q"
